[package]
name = "topvnc-access"
version = "0.2.0"
edition = "2024"
description = "Cloudflare Access JWT verification and WebSocket upgrade policy for TopVNC's gateway and Worker"
publish = false

[features]
test-fixtures = ["dep:rand"]

[dependencies]
base64 = "0.22"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rand = "0.8"
