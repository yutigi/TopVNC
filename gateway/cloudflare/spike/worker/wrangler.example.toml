name = "topvnc-connection-spike"
main = "build/index.js"
compatibility_date = "2026-10-29"
workers_dev = true
preview_urls = false

# Copy to wrangler.local.toml (ignored), then set your non-secret account values.
# Verify Workers Free in the dashboard before deploying; never select Paid.
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[build]
command = "node scripts/build.mjs"

[assets]
directory = "public"
run_worker_first = ["/ws"]

[vars]
APP_ORIGIN = "https://topvnc-connection-spike.YOUR_SUBDOMAIN.workers.dev"
ACCESS_ISSUER = "https://YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUD = "YOUR_ACCESS_APPLICATION_AUD"
OWNER_EMAIL = "you@example.com"
UPSTREAM_URL = "http://127.0.0.1:6080/ws"

# One private HTTP service bound to one tunnel/host/port. Not a public hostname.
[[vpc_services]]
binding = "HOST_NET"
service_id = "00000000-0000-0000-0000-000000000000"
remote = true
