[package]
name = "topvnc-spike-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
topvnc-spike-policy.workspace = true
worker = "=0.8.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-util = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "AbortSignal", "AbortController"] }
