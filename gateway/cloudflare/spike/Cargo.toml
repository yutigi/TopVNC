[workspace]
members = ["policy", "e2e", "host", "browser", "worker"]
default-members = ["policy", "e2e", "host", "browser"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
topvnc-spike-policy = { path = "policy" }
topvnc-spike-e2e = { path = "e2e" }
base64 = "0.22"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
lto = true
opt-level = "s"
# wasm-bindgen needs the name/externref metadata that strip=true removes.
strip = "debuginfo"
