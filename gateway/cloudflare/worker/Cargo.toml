[workspace]

[package]
name = "topvnc-worker"
version = "0.2.0"
edition = "2024"
description = "Cloudflare Worker: Access-verified WebSocket upgrade forwarding to TopVNC's private gateway"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
topvnc-access = { path = "../../../crates/topvnc-access" }
worker = "=0.8.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-util = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "AbortSignal", "AbortController"] }

[profile.release]
lto = true
opt-level = "s"
# wasm-bindgen needs the name/externref metadata that strip=true removes.
strip = "debuginfo"
