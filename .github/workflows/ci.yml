# Repository gates from AGENTS.md on every pull request and on main:
# formatting, Clippy and workspace tests on Windows and Linux, plus the
# WebAssembly browser client, its Node tests, and the Cloudflare Worker.
# macOS is not run here: hosted macOS runners queue too long to gate pull
# requests, so macOS Clippy and tests are run locally on a Mac before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production upload when another main commit arrives.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the compiler, Clippy and rustfmt.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Workspace
        run: cargo fmt --all --check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # display-info links libxcb with RandR and Render. winit loads Wayland,
      # X11 and xkbcommon at run time, so they need no headers to build.
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb1-dev libxcb-randr0-dev libxcb-render0-dev
      # rust-toolchain.toml pins the compiler, Clippy and rustfmt.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  web:
    name: Browser client and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the compiler, Clippy and rustfmt.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy, browser client (wasm32)
        run: cargo clippy --locked --target wasm32-unknown-unknown -p topvnc-web -- -D warnings
      # web/scripts/build.mjs requires the wasm-bindgen CLI that matches the
      # root Cargo.lock, installed under .tools.
      - name: Read the pinned wasm-bindgen version
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tools
        with:
          path: .tools
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked --root .tools
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build browser client
        working-directory: web
        run: npm run build
      - name: Test browser client
        working-directory: web
        run: npm test
      - name: Test WebAssembly bindings
        working-directory: web
        run: npm run test:wasm
      # Plain JavaScript with node:test; it needs no npm install.
      - name: Test Cloudflare Worker
        working-directory: gateway/cloudflare/worker
        run: npm test
      - name: Save tested production assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Cloudflare
    needs: [fmt, rust, web]
    # No pull_request_target/workflow_run or PR checkout with production secrets.
    if: >-
      github.repository == 'yutigi/TopVNC' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Wrangler truncates variables in its informational binding summary,
      # preventing GitHub's full-value secret masking from matching them.
      WRANGLER_LOG: error
      WRANGLER_SEND_METRICS: 'false'
    environment:
      name: cloudflare-production
      url: https://topvnc-connection-spike.js-sookudom-temp.workers.dev
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Refuse to deploy an outdated main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA" || { echo 'main has moved; deploy its latest successful CI run instead.'; exit 1; }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/cloudflare/worker/package-lock.json
      - name: Install pinned Wrangler
        working-directory: gateway/cloudflare/worker
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist
      - name: Prepare existing production configuration
        working-directory: gateway/cloudflare/worker
        env:
          CLOUDFLARE_WRANGLER_CONFIG: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG }}
        run: node scripts/prepare-deploy.mjs
      - name: Check production bundle
        working-directory: gateway/cloudflare/worker
        run: npx --no-install wrangler deploy --dry-run --config wrangler.ci.json
      - name: Deploy tested commit
        working-directory: gateway/cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in cloudflare-production.'; exit 1; }
          npx --no-install wrangler deploy --config wrangler.ci.json --message "GitHub $GITHUB_SHA (run $GITHUB_RUN_ID)"
      - name: Verify unauthenticated Access redirects
        working-directory: gateway/cloudflare/worker
        run: node scripts/verify-access.mjs
      - name: Record deployed revision
        run: |
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'App: https://topvnc-connection-spike.js-sookudom-temp.workers.dev' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unauthenticated Access redirects verified for / and /ws.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove production configuration
        if: always()
        run: rm -f gateway/cloudflare/worker/wrangler.ci.json
