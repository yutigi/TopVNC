name: Native encrypted connection

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tls:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test workspace including native TLS automation
        run: cargo +stable test --locked --workspace
      - name: Lint all targets
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
